name: IFT3913 - Tests EndianUtils

on:
  push:
    branches:
      - main
      - adam-tache2
      - adam-tache3
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tika-core tests
        id: tests
        run: ./mvnw -B -pl tika-core -am test

      - name: Rickroll on test failure
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: ./.github/actions/rickroll

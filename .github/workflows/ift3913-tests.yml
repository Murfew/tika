
name: IFT3913 - Tests EndianUtils

on:
  push:
    branches:
      - main
      - adam-tache2
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tika-core tests
        run: mvn -B -pl tika-core -am test


